# Create the draft GitHub Releases of apps that built fine in an earlier Build run, when that run's own
# release job was skipped because another app in the same run failed.
name: Release from an earlier run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id of the earlier Build run that holds the artifacts"
        type: string
        required: true
      apps:
        description: "Comma-separated apps to release"
        type: string
        required: true

permissions:
  contents: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - id: pick
        env:
          APPS: ${{ inputs.apps }}
        run: echo "apps=$(printf '%s' "$APPS" | tr ',' '\n' | tr -d ' ' | jq -R . | jq -cs .)" >>"$GITHUB_OUTPUT"

  release:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: ${{ matrix.app }}-*
          path: release-files
          merge-multiple: true
      - name: Draft release
        run: scripts/publish-release.sh ${{ matrix.app }} "$PWD/release-files"
