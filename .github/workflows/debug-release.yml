name: Debug release
on: workflow_dispatch
permissions:
  contents: write
jobs:
  try:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "A. Target = old commit that touched workflows (a2763e9)"
        continue-on-error: true
        run: |
          old="$(git rev-parse a2763e9)"
          gh release create dbg-old --draft --target "$old" --title dbg --notes dbg 2>&1 | tail -2
      - name: "B. Target = root commit"
        continue-on-error: true
        run: |
          root="$(git rev-list --max-parents=0 HEAD)"
          gh release create dbg-root --draft --target "$root" --title dbg --notes dbg 2>&1 | tail -2
      - name: "C. No target (default branch tip)"
        continue-on-error: true
        run: gh release create dbg-none --draft --title dbg --notes dbg 2>&1 | tail -2
      - name: "D. Target = branch name main"
        continue-on-error: true
        run: gh release create dbg-main --draft --target main --title dbg --notes dbg 2>&1 | tail -2
      - name: Cleanup
        if: always()
        run: |
          for t in dbg-old dbg-root dbg-none dbg-main; do gh release delete "$t" --yes 2>/dev/null || true; done
