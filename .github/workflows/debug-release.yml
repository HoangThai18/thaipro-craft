name: Debug release
on: workflow_dispatch
permissions:
  contents: write
  actions: read
jobs:
  replica:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [printcraft]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the artifacts of an earlier build
        run: |
          mkdir release-files
          gh run download 37585778960 --name printcraft-windows-x64 --dir release-files
          gh run download 37585778960 --name printcraft-macos-universal --dir release-files
          ls -l release-files
      - name: Replica of the draft release step
        env:
          APP: ${{ matrix.app }}
        run: |
          set -x
          sha="$(git ls-tree HEAD "upstream/$APP" | awk '{print $3}')"
          short="${sha:0:7}"
          cd release-files
          version="$(ls "$APP"-*-windows-x64.msi | sed -E "s/^$APP-(.*)-windows-x64\.msi$/\1/")"
          tag="$APP-$version-$short"
          echo "tag=[$tag] version=[$version] short=[$short] sha=[$sha] GITHUB_SHA=[$GITHUB_SHA]"
          sha256sum -- * >SHA256SUMS.txt
          notes="Bản build thử"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$APP $version ($short) cho Windows và Mac" --notes "$notes" -- * || echo "CREATE FAILED rc=$?"
          gh release delete "$tag" --yes || true
