# Builds the custom desktop apps. scripts/prepare.sh makes a patched and rebranded copy of the pinned
# upstream commit (new names and icons, see scripts/brand), then its own packaging scripts produce the Windows MSI + portable zip and the
# macOS universal DMG. No signing secrets are configured: the Windows files are unsigned and the
# DMG is ad-hoc signed, so SmartScreen and Gatekeeper warn on first launch.
name: Build

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Apps to build: all, or a comma-separated list (any folder under apps/ with KIND=craft)"
        type: string
        default: all
      publish:
        description: "Create a draft GitHub Release from the result"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          APP: ${{ inputs.app }}
        run: |
          all="$(grep -l '^KIND=craft$' apps/*/app.env | xargs -n1 dirname | xargs -n1 basename | sort)"
          if [ "$APP" = all ]; then
            pick="$all"
          else
            pick="$(printf '%s' "$APP" | tr ',' '\n' | tr -d ' ')"
            for a in $pick; do
              printf '%s\n' "$all" | grep -qx "$a" || { echo "unknown app: $a" >&2; exit 1; }
            done
          fi
          echo "apps=$(printf '%s\n' "$pick" | jq -R . | jq -cs .)" >>"$GITHUB_OUTPUT"

  windows:
    needs: plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the upstream base
        shell: bash
        run: git submodule update --init upstream/${{ matrix.app }}
      - name: Read build settings
        shell: bash
        run: grep '^CRAFT_FONTS_REF=' apps/${{ matrix.app }}/app.env >>"$GITHUB_ENV" || true
      - name: Check out craft-fonts (embedded fonts)
        if: env.CRAFT_FONTS_REF != ''
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.app }}
          workspaces: build/${{ matrix.app }}
      - name: Apply patches to a clean copy of the base
        shell: bash
        run: scripts/prepare.sh ${{ matrix.app }}
      - name: Point the build at craft-fonts
        if: env.CRAFT_FONTS_REF != ''
        shell: bash
        run: |
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >>"$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >>"$GITHUB_ENV"
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build and package
        shell: pwsh
        working-directory: build/${{ matrix.app }}
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Build Setup.exe around the MSI
        shell: pwsh
        run: scripts/windows/make-setup.ps1 -App ${{ matrix.app }}
      - name: Install, check and uninstall on this runner
        shell: pwsh
        run: scripts/windows/smoke-test.ps1 -App ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows-x64
          path: build/${{ matrix.app }}/dist/release/*
          if-no-files-found: error

  macos:
    needs: plan
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the upstream base
        run: git submodule update --init upstream/${{ matrix.app }}
      - name: Read build settings
        run: grep '^CRAFT_FONTS_REF=' apps/${{ matrix.app }}/app.env >>"$GITHUB_ENV" || true
      - name: Check out craft-fonts (embedded fonts)
        if: env.CRAFT_FONTS_REF != ''
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.app }}
          workspaces: build/${{ matrix.app }}
      - name: Apply patches to a clean copy of the base
        run: scripts/prepare.sh ${{ matrix.app }}
      - name: Point the build at craft-fonts
        if: env.CRAFT_FONTS_REF != ''
        shell: bash
        run: |
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >>"$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >>"$GITHUB_ENV"
      - name: Build and package
        working-directory: build/${{ matrix.app }}
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-macos-universal
          path: build/${{ matrix.app }}/dist/release/*.dmg
          if-no-files-found: error

  release:
    if: ${{ !cancelled() && inputs.publish && needs.plan.result == 'success' }}
    needs: [plan, windows, macos]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ${{ matrix.app }}-*
          path: release-files
          merge-multiple: true
      - name: Draft release
        run: scripts/publish-release.sh ${{ matrix.app }} "$PWD/release-files"
