# ThaiCutCut (based on OpenCut): the web app and the desktop packages. Upstream ships no
# packaging, so apps/opencut/overlay/packaging holds ours. Every package carries the upstream
# LICENSE and the third-party notice (MIT requires the copyright and permission notice to travel
# with every copy). Nothing is signed: SmartScreen and Gatekeeper warn on first launch.
name: Build ThaiCutCut

on:
  workflow_dispatch:
    inputs:
      web:
        description: "Build the web app too"
        type: boolean
        default: false
      publish:
        description: "Create a draft GitHub Release from the desktop packages"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-opencut
  cancel-in-progress: false

jobs:
  web:
    if: inputs.web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches to a clean copy of the base
        run: |
          git submodule update --init upstream/opencut
          scripts/prepare.sh opencut
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install (versions pinned by the overlay lockfile)
        working-directory: build/opencut/apps/web
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: build/opencut/apps/web
        run: bun run build
      - name: Ship the license notices with the build
        run: |
          cp build/opencut/LICENSE build/opencut/apps/web/dist/client/LICENSE-OpenCut.txt
          cp build/opencut/THIRD_PARTY_LICENSES.md build/opencut/apps/web/dist/client/THIRD_PARTY_LICENSES.md
      - uses: actions/upload-artifact@v4
        with:
          name: thaicutcut-web
          path: build/opencut/apps/web/dist
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches to a clean copy of the base
        shell: bash
        run: |
          git submodule update --init upstream/opencut
          scripts/prepare.sh opencut
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: opencut-windows-x64
          workspaces: build/opencut
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build and package
        shell: pwsh
        working-directory: build/opencut
        run: ./packaging/windows/package.ps1
      - name: Build Setup.exe around the MSI
        shell: pwsh
        run: scripts/windows/make-setup.ps1 -App opencut
      - name: Install, check and uninstall on this runner
        shell: pwsh
        run: scripts/windows/smoke-test.ps1 -App opencut
      - uses: actions/upload-artifact@v4
        with:
          name: thaicutcut-windows-x64
          path: build/opencut/dist/release/*
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches to a clean copy of the base
        run: |
          git submodule update --init upstream/opencut
          scripts/prepare.sh opencut
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: opencut-macos-universal
          workspaces: build/opencut
      - name: Build and package
        working-directory: build/opencut
        run: packaging/macos/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: thaicutcut-macos-universal
          path: build/opencut/dist/release/*.dmg
          if-no-files-found: error

  release:
    if: inputs.publish
    needs: [windows, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: thaicutcut-*
          path: release-files
          merge-multiple: true
      - name: Draft release
        run: |
          sha="$(git ls-tree HEAD upstream/opencut | awk '{print $3}')"
          short="${sha:0:7}"
          cd release-files
          version="$(ls thaicutcut-*-windows-x64.msi | sed -E 's/^thaicutcut-(.*)-windows-x64\.msi$/\1/')"
          tag="thaicutcut-$version-$short"
          sha256sum -- * >SHA256SUMS.txt
          notes="Bản xem trước sớm của ThaiCutCut cho Windows và Mac, dựa trên mã nguồn mở OpenCut (https://github.com/opencut-app/opencut, giấy phép MIT, Copyright 2026 OpenCut), commit $short trên nhánh main. Nhóm OpenCut đang viết lại từ đầu nên app hiện mới là khung giao diện, chưa nhập hay dựng được video. Không phải sản phẩm của OpenCut. Bản Windows chưa ký số và bản Mac chưa được Apple xác minh nên hệ điều hành có thể cảnh báo. Đối chiếu SHA256SUMS.txt trước khi cài. Giấy phép gốc và thư viện bên thứ ba đi kèm trong từng gói."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber -- *
          else
            gh release create "$tag" --draft --target main \
              --title "ThaiCutCut $version ($short) bản xem trước cho Windows và Mac" --notes "$notes" -- *
          fi
